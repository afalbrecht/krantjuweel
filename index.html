<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Krantjuweel</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: skyblue;
      overflow: hidden;
    }
    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: pointer;
    }
    .magic-t {
      position: fixed;
      pointer-events: none;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: bold;
      color: #f5f0e6;
      text-shadow: 0 0 8px rgba(255,255,255,0.8);
      z-index: 10;
      animation: magic-t-rise 1.2s ease-out forwards;
    }
    @keyframes magic-t-rise {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
        filter: blur(0px);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -220%) scale(1.8) rotate(25deg);
        filter: blur(3px);
      }
    }
    .smoke-puff {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0) 70%);
      z-index: 9;
      animation: smoke-rise 1.1s ease-out forwards;
    }
    @keyframes smoke-rise {
      0% {
        opacity: 0.8;
        transform: translate(-50%, -50%) scale(0.3);
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), calc(-50% - 70px)) scale(1.6);
      }
    }
  </style>
</head>
<body>
  <img id="pic" src="theartofpicking.jpg" alt="">
  <script>
    const pic = document.getElementById('pic');

    // Natural-image pixel location of the T in "Timsalabim" on basecamp.jpg
    const EASTER_EGG = { x: 1198, y: 1444, radius: 60 };

    function spawnMagicT(clientX, clientY) {
      const t = document.createElement('div');
      t.className = 'magic-t';
      t.textContent = 'T';
      t.style.left = clientX + 'px';
      t.style.top = clientY + 'px';
      t.style.fontSize = '48px';
      document.body.appendChild(t);
      t.addEventListener('animationend', () => t.remove());

      const puffCount = 6;
      for (let i = 0; i < puffCount; i++) {
        const puff = document.createElement('div');
        puff.className = 'smoke-puff';
        const size = 14 + Math.random() * 16;
        puff.style.width = size + 'px';
        puff.style.height = size + 'px';
        puff.style.left = clientX + 'px';
        puff.style.top = clientY + 'px';
        puff.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
        puff.style.animationDelay = (Math.random() * 0.15) + 's';
        document.body.appendChild(puff);
        puff.addEventListener('animationend', () => puff.remove());
      }
    }

    function getNaturalClickPos(e) {
      const rect = pic.getBoundingClientRect();
      const scale = Math.min(rect.width / pic.naturalWidth, rect.height / pic.naturalHeight);
      const displayedW = pic.naturalWidth * scale;
      const displayedH = pic.naturalHeight * scale;
      const offsetX = rect.left + (rect.width - displayedW) / 2;
      const offsetY = rect.top + (rect.height - displayedH) / 2;
      const clickX = e.clientX - offsetX;
      const clickY = e.clientY - offsetY;
      return {
        x: clickX / scale,
        y: clickY / scale,
      };
    }

    pic.addEventListener('click', (e) => {
      if (pic.src.includes('theartofpicking.jpg')) {
        pic.src = 'basecamp.jpg';
        return;
      }

      const pos = getNaturalClickPos(e);
      const dx = pos.x - EASTER_EGG.x;
      const dy = pos.y - EASTER_EGG.y;
      if (Math.sqrt(dx * dx + dy * dy) <= EASTER_EGG.radius) {
        spawnMagicT(e.clientX, e.clientY);
      }
    });
  </script>
</body>
</html>
