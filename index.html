<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Krantjuweel</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: skyblue;
      overflow: hidden;
    }
    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <img id="pic" src="theartofpicking.jpg" alt="">
  <script>
    const pic = document.getElementById('pic');
    pic.addEventListener('click', () => {
      pic.src = 'basecamp.jpg';
    });
  </script>
</body>
</html>
